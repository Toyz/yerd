name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: check + unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test

  e2e:
    # The full matrix (playwright.all.config.ts): every example in dev and as a
    # production build, the runtime fixture, no-JavaScript and accessibility
    # passes in Chrome, plus Firefox, WebKit and phones. Split across machines.
    name: e2e (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The Chrome projects use the system Chrome (channel "chrome"), which the
      # ubuntu runners ship with; Firefox and WebKit are Playwright's builds.
      - run: npx playwright install --with-deps firefox webkit
      # CI=true: one retry, a trace on that retry, and an HTML report.
      - run: npx playwright test --config playwright.all.config.ts --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
