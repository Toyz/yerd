name: release

# Publishes to npm when a version tag is pushed (`npm version patch && git push --follow-tags`).
# Uses npm trusted publishing: GitHub's OIDC token proves which repo and
# workflow is publishing, so no npm token is stored anywhere, and npm attaches
# a provenance attestation to the package. Configure once on npmjs.com:
# package settings -> Trusted publisher -> GitHub Actions -> Toyz / yerd / release.yml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - name: Tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npx playwright test
      # Verbose: on failure the OIDC exchange says why (npm otherwise just reports E404).
      - run: npm publish --access public --loglevel verbose
