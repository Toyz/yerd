name: docs

# The docs site (site/): API reference generated from src/ on every push to
# main, guides from docs/guide/, built with @toyz/loom, deployed to GitHub Pages.
# "Since" badges come from the release tags, so the checkout needs history.

on:
  push:
    branches: [main]
  # After a release publishes: the version pill and "since" badges count only
  # versions npm has, and the push that tagged the release built before that.
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      # Root deps only for @types/node, so generated signatures name Node types properly.
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: site
      # npm can take a few minutes to serve a version it just accepted; the
      # generator asks it which versions exist.
      - name: Wait for npm to serve the new version
        if: github.event_name == 'workflow_run'
        run: |
          version=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            if npm view "@toyz/yerd@$version" version >/dev/null 2>&1; then echo "npm has $version"; exit 0; fi
            sleep 20
          done
          echo "npm still doesn't list $version; building anyway"
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
