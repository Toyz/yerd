<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>yerd docs</title>
    <meta name="description" content="yerd: a TypeScript web server where routes are decorated classes and TSX is the template engine. API reference generated from the source." />
    <meta name="theme-color" content="#f5efe3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1814" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23d6452b'/><text x='16' y='22.5' text-anchor='middle' font-family='Georgia,serif' font-size='22' fill='%23fff8ee'>y</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap"
    />
    <script>
      // The theme you picked, before first paint (the toggle stores it as JSON).
      try {
        const theme = JSON.parse(localStorage.getItem("yerd-docs:theme") || '"system"');
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <yerd-docs></yerd-docs>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
